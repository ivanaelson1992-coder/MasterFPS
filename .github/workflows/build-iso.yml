name: Gerar ISO MasterFPSOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Gerar a ISO dentro de um Arch Linux
        run: |
          docker run --rm --privileged -v "$PWD":/work archlinux:latest \
            bash -c "pacman -Syu --noconfirm && cd /work && chmod +x build.sh && ./build.sh"

      - name: Enviar a ISO
        uses: actions/upload-artifact@v4
        with:
          name: MasterFPSOS-ISO
          path: out/*.iso
          if-no-files-found: error

      - name: Enviar a ISO para o Pixeldrain (download mais rapido)
        run: |
          ISO=$(ls out/*.iso)
          RESP=$(curl -fsS -T "$ISO" "https://pixeldrain.com/api/file/$(basename "$ISO")")
          echo "Resposta: $RESP"
          ID=$(echo "$RESP" | jq -r .id)
          {
            echo "Link: https://pixeldrain.com/u/$ID"
            echo "Download direto: https://pixeldrain.com/api/file/$ID"
          } | tee pixeldrain-link.txt

      - name: Publicar o link do Pixeldrain
        uses: actions/upload-artifact@v4
        with:
          name: pixeldrain-link
          path: pixeldrain-link.txt
          if-no-files-found: error
